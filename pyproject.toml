[project]
name = "claw-bot"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-telegram-bot>=21.0",
  "groq>=0.11.0",
  "google-auth>=2.35.0",
  "requests>=2.32.0",
  "psycopg[binary,pool]>=3.2.0",
]

[project.scripts]
start = "main:run"

[tool.vercel]
entrypoint = "main:app"
